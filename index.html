<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>City Drive - Motion & Gesture</title>
<style>
  :root{
    --bg:#0f171a; --ink:#f4efe2; --road:#2b3035; --grass:#325327; --accent:#f2b134;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;width:100%;background:var(--bg);color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",sans-serif;touch-action:none;
    overflow:hidden;user-select:none;
  }
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6px;gap:6px;
  }
  canvas{
    height:min(88vh, 690px);max-width:100%;aspect-ratio:400/640;border-radius:18px;
    box-shadow:0 14px 40px rgba(0,0,0,0.7), 0 0 0 3px #080f11;
    display:block;background:var(--road);cursor:pointer;
  }
  .guide{
    display:flex;gap:6px;font-size:11px;letter-spacing:0.3px;opacity:0.85;
    text-align:center;justify-content:center;flex-wrap:wrap;max-width:400px;
  }
  .guide span{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);
    padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;
  }
</style>
</head>
<body>

<canvas id="g" width="400" height="640"></canvas>

<div class="guide">
  <span>📱 Tilt / Swipe left-right to steer</span>
  <span>👆 Hold for Gas</span>
  <span>🔻 Tap bottom to Brake</span>
  <span>🪙 Coins • ⛽ Fuel • ⚡ Nitro • 🧲 Magnet</span>
</div>

<script>
(() => {
  const canvas = document.getElementById('g');
  const ctx = canvas.getContext('2d');
  const W = 400, H = 640;

  // Road geometry: 3 lanes
  const ROAD_L = 45;
  const ROAD_R = 355;
  const ROAD_W = ROAD_R - ROAD_L;
  const LANE_W = ROAD_W / 3;
  const LANES = [
    ROAD_L + LANE_W * 0.5,
    ROAD_L + LANE_W * 1.5,
    ROAD_L + LANE_W * 2.5
  ];

  // Visual Themes
  const THEMES = [
    { name: 'Midnight', bg: '#0f171a', road: '#2b3035', grass: '#325327', accent: '#f2b134', light: 'rgba(242, 177, 52, 0.22)' },
    { name: 'Cyberpunk', bg: '#160a22', road: '#241f33', grass: '#4a1b52', accent: '#00cec9', light: 'rgba(0, 206, 201, 0.25)' },
    { name: 'Sunset Dusk', bg: '#260f17', road: '#331d27', grass: '#54231b', accent: '#fab1a0', light: 'rgba(250, 177, 160, 0.22)' }
  ];

  const NPC_COLORS = ['#e74c3c', '#3498db', '#9b59b6', '#2ecc71', '#e67e22', '#1abc9c', '#e84393', '#fdcb6e'];

  // Game state
  let state = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
  let gameOverReason = ''; // 'CRASH' | 'FUEL'
  let score = 0;
  let coins = 0;
  let highScore = parseInt(localStorage.getItem('city_drive_hi') || '0', 10);
  let speed = 6.5;
  const MIN_SPEED = 2.5;
  const MAX_SPEED = 14.5;
  const NITRO_SPEED = 20.5;
  const CRUISE_SPEED = 7.0;
  let roadOffset = 0;
  let shake = 0;
  let spawnTimer = 0;
  let itemSpawnTimer = 35;

  // Fuel System (0 - 100)
  let fuel = 100;
  const MAX_FUEL = 100;

  // Power-Ups
  let nitroTimer = 0;
  let magnetTimer = 0;

  // Player Car
  const player = {
    x: LANES[1] - 18,
    y: 500,
    w: 36,
    h: 62,
    vx: 0
  };

  // Entities
  let traffic = [];
  let items = [];
  let particles = [];
  let floatingTexts = [];
  let streetLamps = [];

  for (let y = -40; y < H + 100; y += 140) {
    streetLamps.push({ y });
  }

  // --- AUDIO SYNTHESIZER ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) audioCtx = new AudioCtx();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      if (type === 'coin') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(988, t);
        osc.frequency.setValueAtTime(1320, t + 0.08);
        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.25);
      } else if (type === 'fuel') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, t);
        osc.frequency.exponentialRampToValueAtTime(680, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.28);
      } else if (type === 'nitro') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.35);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      } else if (type === 'crash') {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.35, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.08));
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
        src.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(t);
      }
    } catch (e) {}
  }

  // --- SENSING & GESTURE CONTROLS ---
  let tiltGamma = 0;
  let hasTilt = false;
  let isTouching = false;
  let isGas = false;
  let isBraking = false;
  let lastTouchX = null;
  let motionPermissionRequested = false;

  // Request Gyroscope / Motion Permission on iOS & modern devices
  function requestOrientationPermission() {
    if (motionPermissionRequested) return;
    motionPermissionRequested = true;
    initAudio();

    if (typeof DeviceOrientationEvent !== 'undefined') {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(res => {
            if (res === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
          })
          .catch(() => {});
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }
  }

  function handleOrientation(e) {
    if (e.gamma !== null && e.gamma !== undefined) {
      tiltGamma = e.gamma; // negative = left, positive = right
      hasTilt = true;
    }
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  // Pointer & Gesture Listeners
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    requestOrientationPermission();

    if (state === 'START' || state === 'GAMEOVER') {
      startGame();
      return;
    }

    const pos = getCanvasPos(e);
    isTouching = true;
    lastTouchX = pos.x;

    // Bottom 22% of canvas is Brake, everywhere else is Gas
    if (pos.y > H * 0.78) {
      isBraking = true;
      isGas = false;
    } else {
      isGas = true;
      isBraking = false;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isTouching || state !== 'PLAYING') return;
    const pos = getCanvasPos(e);

    // RELATIVE HORIZONTAL SWIPE / DRAG GESTURE (Does NOT snap car to thumb position!)
    if (lastTouchX !== null) {
      const deltaX = pos.x - lastTouchX;
      player.vx += deltaX * 0.22;
    }
    lastTouchX = pos.x;

    if (pos.y > H * 0.78) {
      isBraking = true;
      isGas = false;
    } else {
      isGas = true;
      isBraking = false;
    }
  });

  const endTouch = () => {
    isTouching = false;
    isGas = false;
    isBraking = false;
    lastTouchX = null;
  };

  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);
  canvas.addEventListener('pointerleave', endTouch);

  // Keyboard controls as seamless desktop alternate
  const activeKeys = { left: false, right: false, up: false, down: false };
  window.addEventListener('keydown', (e) => {
    initAudio();
    if (state === 'START' || state === 'GAMEOVER') {
      if (e.code === 'Space' || e.key === 'Enter') {
        startGame();
        return;
      }
    }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') activeKeys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') activeKeys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') activeKeys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') activeKeys.down = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') activeKeys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') activeKeys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') activeKeys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') activeKeys.down = false;
  });

  function startGame() {
    score = 0;
    coins = 0;
    fuel = 100;
    nitroTimer = 0;
    magnetTimer = 0;
    speed = CRUISE_SPEED;
    player.x = LANES[1] - player.w / 2;
    player.y = 500;
    player.vx = 0;
    lastTouchX = null;
    traffic = [];
    items = [];
    particles = [];
    floatingTexts = [];
    spawnTimer = 20;
    itemSpawnTimer = 30;
    shake = 0;
    state = 'PLAYING';
  }

  function addFloatText(x, y, text, color) {
    floatingTexts.push({
      x: x,
      y: y,
      text: text,
      color: color,
      life: 1.0
    });
  }

  function spawnTraffic() {
    const availableLanes = LANES.filter(lx => {
      return !traffic.some(c => Math.abs(c.x + c.w / 2 - lx) < 22 && c.y < 130);
    });
    if (availableLanes.length === 0) return;

    const laneX = availableLanes[Math.floor(Math.random() * availableLanes.length)];
    const npcSpeed = 2.5 + Math.random() * 3.0;
    const color = NPC_COLORS[Math.floor(Math.random() * NPC_COLORS.length)];

    traffic.push({
      x: laneX - 17,
      y: -70,
      w: 34,
      h: 60,
      speed: npcSpeed,
      color: color,
      passed: false
    });
  }

  function spawnItems() {
    const availableLanes = LANES.filter(lx => {
      return !traffic.some(c => Math.abs(c.x + c.w / 2 - lx) < 30 && c.y < 120);
    });
    if (availableLanes.length === 0) return;

    const laneX = availableLanes[Math.floor(Math.random() * availableLanes.length)];
    const rand = Math.random();

    // Spawning Probability: 55% Coins, 26% Fuel, 11% Nitro, 8% Magnet
    if (rand < 0.55) {
      const count = Math.random() < 0.4 ? 3 : 1;
      for (let i = 0; i < count; i++) {
        items.push({
          type: 'coin',
          x: laneX,
          y: -40 - (i * 45),
          r: 13,
          rot: Math.random() * Math.PI,
          passed: false
        });
      }
    } else if (rand < 0.81) {
      items.push({
        type: 'fuel',
        x: laneX,
        y: -50,
        w: 26,
        h: 28,
        passed: false
      });
    } else if (rand < 0.92) {
      items.push({
        type: 'nitro',
        x: laneX,
        y: -50,
        w: 24,
        h: 30,
        passed: false
      });
    } else {
      items.push({
        type: 'magnet',
        x: laneX,
        y: -50,
        w: 26,
        h: 26,
        passed: false
      });
    }
  }

  function addExplosion(x, y, isNitroSmash) {
    playSound('crash');
    const count = isNitroSmash ? 24 : 40;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = Math.random() * (isNitroSmash ? 8 : 6) + 2;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        life: 1,
        decay: Math.random() * 0.03 + 0.02,
        color: isNitroSmash ? '#00cec9' : (Math.random() > 0.4 ? '#f2b134' : '#e74c3c'),
        size: Math.random() * 5 + 3
      });
    }
  }

  function addExhaustFlames(x, y) {
    particles.push({
      x: x + (Math.random() * 6 - 3),
      y: y,
      vx: (Math.random() - 0.5) * 1.5,
      vy: Math.random() * 4 + 4,
      life: 0.7,
      decay: 0.05,
      color: Math.random() > 0.5 ? '#00cec9' : '#0984e3',
      size: Math.random() * 4 + 4
    });
  }

  function addSkid(x, y) {
    if (Math.random() < 0.4) {
      particles.push({
        x: x + (Math.random() * 6 - 3),
        y: y,
        vx: (Math.random() - 0.5) * 0.5,
        vy: speed * 0.5,
        life: 0.6,
        decay: 0.03,
        color: 'rgba(255,255,255,0.4)',
        size: Math.random() * 4 + 4
      });
    }
  }

  function update() {
    if (shake > 0) shake *= 0.9;
    if (shake < 0.1) shake = 0;

    const activeSpeed = state === 'PLAYING' ? speed : 2;
    roadOffset = (roadOffset + activeSpeed) % 60;
    streetLamps.forEach(lamp => {
      lamp.y += activeSpeed;
      if (lamp.y > H + 50) lamp.y -= (H + 100);
    });

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Update Floating Texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 1.2;
      ft.life -= 0.02;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    if (state !== 'PLAYING') return;

    // --- POWER-UP TIMERS ---
    if (nitroTimer > 0) {
      nitroTimer--;
      addExhaustFlames(player.x + 8, player.y + player.h);
      addExhaustFlames(player.x + player.w - 8, player.y + player.h);
    }
    if (magnetTimer > 0) magnetTimer--;

    // --- BALANCED FUEL DYNAMICS ---
    // Gives ~50 seconds of base driving before needing refuel
    const fuelDrain = (0.025 + (speed / MAX_SPEED) * 0.022) * (nitroTimer > 0 ? 0.2 : 1);
    fuel -= fuelDrain;

    if (fuel <= 0) {
      fuel = 0;
      speed = Math.max(0, speed - 0.12);
      if (speed <= 0.2) {
        state = 'GAMEOVER';
        gameOverReason = 'FUEL';
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('city_drive_hi', highScore);
        }
        return;
      }
    }

    // --- ACCELERATION / BRAKING ---
    const gasRequested = isGas || activeKeys.up;
    const brakeRequested = isBraking || activeKeys.down;

    if (nitroTimer > 0) {
      speed = NITRO_SPEED;
    } else if (gasRequested && fuel > 0) {
      speed = Math.min(MAX_SPEED, speed + 0.14);
    } else if (brakeRequested) {
      speed = Math.max(MIN_SPEED, speed - 0.28);
      addSkid(player.x + 8, player.y + player.h);
      addSkid(player.x + player.w - 8, player.y + player.h);
    } else {
      // Smooth cruising
      if (speed > CRUISE_SPEED) speed -= 0.05;
      else if (speed < CRUISE_SPEED && fuel > 0) speed += 0.05;
    }

    // --- SMOOTH STEERING (TILT GYRO + RELATIVE GESTURE + KEYBOARD) ---
    // 1. Mobile Tilt Gyroscope
    if (hasTilt && Math.abs(tiltGamma) > 2.0) {
      const tiltNorm = Math.max(-1, Math.min(1, tiltGamma / 22));
      player.vx += tiltNorm * 0.85;
    }

    // 2. Keyboard fallback
    if (activeKeys.left) player.vx -= 0.85;
    if (activeKeys.right) player.vx += 0.85;

    // Apply friction damping
    player.vx *= 0.82;
    player.x += player.vx;

    // Road boundaries
    if (player.x < ROAD_L + 4) {
      player.x = ROAD_L + 4;
      player.vx = 0;
    }
    if (player.x + player.w > ROAD_R - 4) {
      player.x = ROAD_R - 4 - player.w;
      player.vx = 0;
    }

    // Score accumulation
    score += Math.round(speed * 0.12);

    // --- ITEM SPAWNING ---
    itemSpawnTimer--;
    if (itemSpawnTimer <= 0) {
      spawnItems();
      itemSpawnTimer = Math.max(26, Math.floor(65 - speed * 1.5 + Math.random() * 20));
    }

    // --- ITEM PICKUP & MAGNET LOGIC ---
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += speed * 0.95;

      // Magnet pull
      if (magnetTimer > 0 && it.type === 'coin') {
        const dx = (player.x + player.w / 2) - it.x;
        const dy = (player.y + player.h / 2) - it.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 230) {
          it.x += (dx / dist) * 8.0;
          it.y += (dy / dist) * 8.0;
        }
      }

      // Pickup Collision
      const itW = it.w || (it.r * 2);
      const itH = it.h || (it.r * 2);

      if (
        player.x < it.x + itW / 2 &&
        player.x + player.w > it.x - itW / 2 &&
        player.y < it.y + itH / 2 &&
        player.y + player.h > it.y - itH / 2
      ) {
        if (it.type === 'coin') {
          coins++;
          score += 100;
          playSound('coin');
          addFloatText(it.x, it.y, '+100 🪙', '#f1c40f');
        } else if (it.type === 'fuel') {
          fuel = Math.min(MAX_FUEL, fuel + 42);
          playSound('fuel');
          addFloatText(it.x, it.y, '+FUEL ⛽', '#2ecc71');
        } else if (it.type === 'nitro') {
          nitroTimer = 240;
          playSound('nitro');
          shake = 10;
          addFloatText(it.x, it.y, 'NITRO BOOST! ⚡', '#00cec9');
        } else if (it.type === 'magnet') {
          magnetTimer = 360;
          playSound('fuel');
          addFloatText(it.x, it.y, 'MAGNET! 🧲', '#fd79a8');
        }
        items.splice(i, 1);
        continue;
      }

      if (it.y > H + 50) {
        items.splice(i, 1);
      }
    }

    // --- TRAFFIC SPAWNING ---
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnTraffic();
      spawnTimer = Math.max(28, Math.floor(75 - speed * 2.2 + Math.random() * 20));
    }

    // --- TRAFFIC UPDATE, CLOSE-PASS BONUS & CRASH DETECTION ---
    for (let i = traffic.length - 1; i >= 0; i--) {
      const npc = traffic[i];
      npc.y += (speed - npc.speed);

      // Overtake & Near-Miss bonus
      if (!npc.passed && npc.y > player.y + player.h) {
        npc.passed = true;
        const latDist = Math.abs((player.x + player.w / 2) - (npc.x + npc.w / 2));
        if (latDist < 46) {
          score += 120;
          addFloatText(player.x + player.w / 2, player.y - 15, 'CLOSE PASS! +120', '#fab1a0');
        } else {
          score += 50;
        }
      }

      if (npc.y > H + 100 || npc.y < -200) {
        traffic.splice(i, 1);
        continue;
      }

      // Collision Check
      const mX = 4, mY = 5;
      if (
        player.x + mX < npc.x + npc.w - mX &&
        player.x + player.w - mX > npc.x + mX &&
        player.y + mY < npc.y + npc.h - mY &&
        player.y + player.h - mY > npc.y + mY
      ) {
        if (nitroTimer > 0) {
          // Smash through traffic during Nitro!
          addExplosion(npc.x + npc.w / 2, npc.y + npc.h / 2, true);
          score += 250;
          shake = 12;
          addFloatText(npc.x, npc.y, 'SMASH! +250 💥', '#00cec9');
          traffic.splice(i, 1);
        } else {
          state = 'GAMEOVER';
          gameOverReason = 'CRASH';
          shake = 18;
          addExplosion(player.x + player.w / 2, player.y + 20, false);
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('city_drive_hi', highScore);
          }
          break;
        }
      }
    }
  }

  // --- DRAWING FUNCTIONS ---
  function drawItem(it) {
    ctx.save();
    ctx.translate(it.x, it.y);

    if (it.type === 'coin') {
      it.rot = (it.rot || 0) + 0.08;
      const coinWidth = Math.max(3, Math.abs(Math.cos(it.rot)) * 13);
      ctx.fillStyle = 'rgba(241, 196, 15, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 0, coinWidth + 4, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f39c12';
      ctx.beginPath();
      ctx.ellipse(0, 0, coinWidth, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.ellipse(0, 0, coinWidth * 0.72, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (it.type === 'fuel') {
      ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.roundRect(-12, -14, 24, 28, 4);
      ctx.fill();
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(-6, -18, 12, 4);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAS', 0, 4);
    } else if (it.type === 'nitro') {
      ctx.fillStyle = 'rgba(0, 206, 201, 0.4)';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0984e3';
      ctx.beginPath();
      ctx.roundRect(-10, -14, 20, 28, 5);
      ctx.fill();
      ctx.fillStyle = '#dfe6e9';
      ctx.fillRect(-5, -18, 10, 4);
      ctx.fillStyle = '#00cec9';
      ctx.font = 'bold 12px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡', 0, 5);
    } else if (it.type === 'magnet') {
      ctx.fillStyle = 'rgba(253, 121, 168, 0.35)';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧲', 0, 0);
    }

    ctx.restore();
  }

  function drawCar(x, y, w, h, color, isPlayer, braking) {
    ctx.save();
    ctx.translate(x, y);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath();
    ctx.roundRect(-3, 3, w + 6, h + 2, 8);
    ctx.fill();

    // Wheels
    ctx.fillStyle = '#11181c';
    ctx.fillRect(-3, 8, 4, 12);
    ctx.fillRect(w - 1, 8, 4, 12);
    ctx.fillRect(-3, h - 20, 4, 12);
    ctx.fillRect(w - 1, h - 20, 4, 12);

    // Body
    if (isPlayer && nitroTimer > 0) {
      ctx.shadowColor = '#00cec9';
      ctx.shadowBlur = 15;
    }
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(0, 0, w, h, 8);
    ctx.fill();

    // Roof
    ctx.fillStyle = '#141d22';
    ctx.beginPath();
    ctx.roundRect(4, 15, w - 8, h - 30, 5);
    ctx.fill();

    // Windshield
    ctx.fillStyle = '#618696';
    ctx.beginPath();
    ctx.roundRect(6, 17, w - 12, 10, 3);
    ctx.fill();

    // Rear glass
    ctx.fillStyle = '#3a505b';
    ctx.beginPath();
    ctx.roundRect(6, h - 23, w - 12, 6, 2);
    ctx.fill();

    // Headlights
    ctx.fillStyle = '#fff4cc';
    ctx.fillRect(3, 1, 6, 3);
    ctx.fillRect(w - 9, 1, 6, 3);

    // Light Beams
    if (isPlayer) {
      const grad = ctx.createLinearGradient(0, 0, 0, -150);
      grad.addColorStop(0, 'rgba(255, 244, 180, 0.35)');
      grad.addColorStop(1, 'rgba(255, 244, 180, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-28, -145);
      ctx.lineTo(w + 28, -145);
      ctx.lineTo(w, 0);
      ctx.closePath();
      ctx.fill();

      if (magnetTimer > 0) {
        ctx.strokeStyle = 'rgba(253, 121, 168, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, 38 + Math.sin(Date.now() / 100) * 4, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Taillights
    if (braking) {
      ctx.fillStyle = '#ff1818';
      ctx.shadowColor = '#ff2222';
      ctx.shadowBlur = 12;
      ctx.fillRect(2, h - 4, 8, 4);
      ctx.fillRect(w - 10, h - 4, 8, 4);
    } else {
      ctx.fillStyle = '#a81c1c';
      ctx.fillRect(3, h - 3, 6, 3);
      ctx.fillRect(w - 9, h - 3, 6, 3);
    }

    ctx.restore();
  }

  function draw() {
    ctx.save();

    // Screen Shake
    if (shake > 0) {
      const sx = (Math.random() - 0.5) * shake;
      const sy = (Math.random() - 0.5) * shake;
      ctx.translate(sx, sy);
    }

    const themeIdx = Math.floor(score / 600) % THEMES.length;
    const curTheme = THEMES[themeIdx];

    // 1. Environment & Sidewalks
    ctx.fillStyle = curTheme.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = curTheme.grass;
    ctx.fillRect(0, 0, ROAD_L - 8, H);
    ctx.fillRect(ROAD_R + 8, 0, W - (ROAD_R + 8), H);

    // Curbs
    const curbW = 8;
    for (let y = -60; y < H + 60; y += 20) {
      const isRed = Math.floor((y + roadOffset) / 20) % 2 === 0;
      ctx.fillStyle = isRed ? '#b83b3b' : '#d4cebe';
      ctx.fillRect(ROAD_L - curbW, y + (roadOffset % 20), curbW, 20);
      ctx.fillRect(ROAD_R, y + (roadOffset % 20), curbW, 20);
    }

    // 2. Asphalt Road
    ctx.fillStyle = curTheme.road;
    ctx.fillRect(ROAD_L, 0, ROAD_W, H);

    // Shoulders
    ctx.fillStyle = curTheme.accent;
    ctx.fillRect(ROAD_L + 3, 0, 3, H);
    ctx.fillRect(ROAD_R - 6, 0, 3, H);

    // Lane Dividers
    ctx.fillStyle = '#e8edf0';
    for (let l = 1; l <= 2; l++) {
      const lx = ROAD_L + l * LANE_W - 2;
      for (let y = -40; y < H + 40; y += 50) {
        ctx.fillRect(lx, y + (roadOffset % 50), 4, 26);
      }
    }

    // 3. Street Lamps
    streetLamps.forEach(lamp => {
      ctx.fillStyle = '#223238';
      ctx.fillRect(10, lamp.y, 16, 6);
      ctx.beginPath();
      ctx.arc(26, lamp.y + 3, 5, 0, Math.PI * 2);
      ctx.fillStyle = curTheme.accent;
      ctx.fill();

      ctx.fillStyle = '#223238';
      ctx.fillRect(W - 26, lamp.y, 16, 6);
      ctx.beginPath();
      ctx.arc(W - 26, lamp.y + 3, 5, 0, Math.PI * 2);
      ctx.fillStyle = curTheme.accent;
      ctx.fill();

      const lightGrad = ctx.createRadialGradient(26, lamp.y + 3, 3, 26, lamp.y + 3, 40);
      lightGrad.addColorStop(0, curTheme.light);
      lightGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = lightGrad;
      ctx.beginPath();
      ctx.arc(26, lamp.y + 3, 40, 0, Math.PI * 2);
      ctx.fill();
    });

    // 4. Nitro Warp Speed Lines
    if (nitroTimer > 0) {
      ctx.strokeStyle = 'rgba(0, 206, 201, 0.45)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 10; i++) {
        const lx = ROAD_L + Math.random() * ROAD_W;
        const ly = Math.random() * H;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx, ly + 60);
        ctx.stroke();
      }
    }

    // 5. Collectibles & Power-Ups
    items.forEach(drawItem);

    // 6. Traffic NPCs
    traffic.forEach(npc => {
      drawCar(npc.x, npc.y, npc.w, npc.h, npc.color, false, false);
    });

    // 7. Player Car
    if (state !== 'GAMEOVER') {
      const carColor = nitroTimer > 0 ? '#00cec9' : '#f2b134';
      drawCar(player.x, player.y, player.w, player.h, carColor, true, (isBraking || activeKeys.down));
    }

    // 8. Particles
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // 9. Floating Texts
    floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 16px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });

    ctx.restore(); // Restore shake

    // --- BRAKE ZONE FOOTER ---
    if (state === 'PLAYING') {
      ctx.save();
      const brakingActive = isBraking || activeKeys.down;
      ctx.fillStyle = brakingActive ? 'rgba(231, 76, 60, 0.28)' : 'rgba(255, 255, 255, 0.04)';
      ctx.fillRect(ROAD_L, H - 70, ROAD_W, 70);
      ctx.fillStyle = brakingActive ? '#ff7675' : 'rgba(244, 239, 226, 0.35)';
      ctx.font = '11px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(brakingActive ? '⚠ BRAKING' : 'TAP BOTTOM TO BRAKE', W / 2, H - 26);
      ctx.restore();
    }

    // --- GYRO TILT SENSOR HUD BADGE ---
    if (state === 'PLAYING') {
      ctx.save();
      const tiltW = 60, tiltX = W / 2, tiltY = H - 85;
      ctx.fillStyle = 'rgba(20, 31, 35, 0.65)';
      ctx.beginPath();
      ctx.roundRect(tiltX - tiltW / 2, tiltY - 4, tiltW, 8, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(tiltX - 1, tiltY - 6, 2, 12);
      const dotOffset = hasTilt ? Math.max(-tiltW / 2 + 4, Math.min(tiltW / 2 - 4, (tiltGamma / 30) * (tiltW / 2))) : 0;
      ctx.fillStyle = curTheme.accent;
      ctx.beginPath();
      ctx.arc(tiltX + dotOffset, tiltY, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // --- MAIN DYNAMIC HUD OVERLAY ---
    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 26, 0.92)';
    ctx.beginPath();
    ctx.roundRect(10, 10, W - 20, 56, 12);
    ctx.fill();

    // Line 1: Score & Coins & Speed
    ctx.fillStyle = '#f4efe2';
    ctx.font = 'bold 14px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 22, 30);

    ctx.fillStyle = '#f1c40f';
    ctx.fillText(`🪙 ${coins}`, 145, 30);

    const isSpeeding = isGas || activeKeys.up;
    const isSlowing = isBraking || activeKeys.down;
    ctx.fillStyle = nitroTimer > 0 ? '#00cec9' : (isSpeeding ? '#2ecc71' : (isSlowing ? '#e74c3c' : curTheme.accent));
    ctx.textAlign = 'right';
    const speedKmh = Math.round(speed * 12);
    ctx.fillText(`${speedKmh} KM/H ${nitroTimer > 0 ? '⚡ NOS' : ''}`, W - 22, 30);

    // Line 2: Fuel Progress Bar
    const fuelBarX = 22;
    const fuelBarY = 42;
    const fuelBarW = 140;
    const fuelBarH = 12;

    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.roundRect(fuelBarX, fuelBarY, fuelBarW, fuelBarH, 4);
    ctx.fill();

    const fuelRatio = Math.max(0, fuel / MAX_FUEL);
    const fuelColor = fuelRatio < 0.25 ? ((Math.floor(Date.now() / 200) % 2 === 0) ? '#e74c3c' : '#ffffff') : (fuelRatio < 0.5 ? '#f39c12' : '#2ecc71');
    ctx.fillStyle = fuelColor;
    ctx.beginPath();
    ctx.roundRect(fuelBarX, fuelBarY, fuelBarW * fuelRatio, fuelBarH, 4);
    ctx.fill();

    ctx.fillStyle = '#f4efe2';
    ctx.font = '9px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`⛽ FUEL ${Math.round(fuel)}%`, fuelBarX + 4, fuelBarY + 9);

    // Active Power-Up Timers on right side
    ctx.textAlign = 'right';
    if (nitroTimer > 0) {
      ctx.fillStyle = '#00cec9';
      ctx.font = 'bold 11px "Trebuchet MS", sans-serif';
      ctx.fillText(`⚡ NITRO: ${(nitroTimer / 60).toFixed(1)}s`, W - 22, 52);
    } else if (magnetTimer > 0) {
      ctx.fillStyle = '#fd79a8';
      ctx.font = 'bold 11px "Trebuchet MS", sans-serif';
      ctx.fillText(`🧲 MAGNET: ${(magnetTimer / 60).toFixed(1)}s`, W - 22, 52);
    } else {
      ctx.fillStyle = 'rgba(244, 239, 226, 0.6)';
      ctx.font = '11px "Trebuchet MS", sans-serif';
      ctx.fillText(`BEST: ${highScore}`, W - 22, 52);
    }

    ctx.restore();

    // --- START SCREEN ---
    if (state === 'START') {
      ctx.fillStyle = 'rgba(15, 23, 26, 0.88)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#f2b134';
      ctx.font = '900 36px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CITY DRIVE', W / 2, H / 2 - 105);

      ctx.fillStyle = '#f4efe2';
      ctx.font = '15px "Trebuchet MS", sans-serif';
      ctx.fillText('Motion Steering & Power-Ups', W / 2, H / 2 - 72);

      // Features Box
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.roundRect(28, H / 2 - 50, W - 56, 150, 14);
      ctx.fill();

      ctx.font = '13px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#fab1a0';
      ctx.fillText('📱 Tilt phone OR swipe left/right to steer', 42, H / 2 - 24);
      ctx.fillStyle = '#2ecc71';
      ctx.fillText('🚗 Auto-Cruises! Hold screen for extra Gas', 42, H / 2 + 2);
      ctx.fillStyle = '#f1c40f';
      ctx.fillText('🪙 Collect Coins & ⛽ Refuel gas cans', 42, H / 2 + 28);
      ctx.fillStyle = '#00cec9';
      ctx.fillText('⚡ Grab Nitro to smash oncoming cars!', 42, H / 2 + 54);
      ctx.fillStyle = '#fd79a8';
      ctx.fillText('🧲 Magnets pull all nearby coins to you', 42, H / 2 + 80);

      const pulse = (Math.sin(Date.now() / 250) + 1) * 0.5;
      ctx.fillStyle = `rgba(242, 177, 52, ${0.45 + pulse * 0.55})`;
      ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('TAP ANYWHERE TO START', W / 2, H / 2 + 145);
    }

    // --- GAME OVER SCREEN ---
    if (state === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(13, 18, 20, 0.90)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = gameOverReason === 'FUEL' ? '#f39c12' : '#ff4d4d';
      ctx.font = '900 36px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(gameOverReason === 'FUEL' ? 'OUT OF FUEL! ⛽' : 'CRASHED! 💥', W / 2, H / 2 - 75);

      ctx.fillStyle = '#f4efe2';
      ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
      ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 - 25);

      ctx.fillStyle = '#f1c40f';
      ctx.font = '17px "Trebuchet MS", sans-serif';
      ctx.fillText(`Coins Collected: ${coins} 🪙`, W / 2, H / 2 + 5);

      ctx.fillStyle = '#fab1a0';
      ctx.font = '15px "Trebuchet MS", sans-serif';
      ctx.fillText(`High Score: ${highScore}`, W / 2, H / 2 + 35);

      const pulse = (Math.sin(Date.now() / 200) + 1) * 0.5;
      ctx.fillStyle = `rgba(244, 239, 226, ${0.5 + pulse * 0.5})`;
      ctx.font = 'bold 17px "Trebuchet MS", sans-serif';
      ctx.fillText('TAP ANYWHERE TO REPLAY', W / 2, H / 2 + 95);
    }
  }

  // Main Animation Loop
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
